name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10.*'
          - laravel: '13'
            testbench: '11.*'
        exclude:
          # Laravel 13 requires PHP >= 8.3
          - laravel: '13'
            php: '8.2'

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require \
            "illuminate/contracts:^${{ matrix.laravel }}.0" \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" \
            --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci --coverage --min=100
